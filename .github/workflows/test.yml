name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chronicle/package-lock.json
      - name: Chronicle unit tests
        working-directory: chronicle
        run: |
          npm ci
          npm run test:unit
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Run tests with coverage
        working-directory: java-server
        run: ./mvnw -B -ntp verify -Dmaven.test.failure.ignore=true
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: java-server/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
      - name: Upload JaCoCo report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: java-server/target/site/jacoco
          retention-days: 14
      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'java-server/target/{surefire,failsafe}-reports/TEST-*.xml'
          fail_on_failure: true
          require_tests: true
